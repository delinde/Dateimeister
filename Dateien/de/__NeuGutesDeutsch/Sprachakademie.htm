<ue>Deutsche Sprachakademie</ue><hr>

 
Nach dem Vorbild der <i>Académie française</i>  haben Bürger bereits die Namensrechte für eine <i>Deutsche Sprachakademie</i> gesichert, das bedeutet insbesondere, daß die Internetanschriften  sprachakademie.de  und  deutsche-sprachakademie.de  verfügbar sind.
